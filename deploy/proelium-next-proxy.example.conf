# Rotas de módulos já construídas pelo frontend Next.js. A raiz continua no shell legado
# até que o shell autenticado principal tenha cobertura de interface autenticada.
location ~ ^/api/(auth/me|auth/login|agenda|clients|equipment|execution|diagram|finance|knowledge|company/users|collaborators|installations|operations|support-tickets|opportunities|products|services|product-library|purchases|survey|quality|quotes|reports|routines|tasks|projects)(/|$) {
    proxy_pass http://127.0.0.1:4300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_buffering off;
}

location ~ ^/(clients|projects|processes|commercial|quotes|finance|bi|operations|agenda|products|product-library|product-connections|quality|knowledge|equipment|purchases|survey|reports|routines|installations|collaborators|settings|users|invites)(/|$) {
    proxy_pass http://127.0.0.1:4300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}

location /_next/ { proxy_pass http://127.0.0.1:4300; }
