name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: proelium-vps-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and validate
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm --prefix frontend ci --no-audit --no-fund
          npm run check:frontend

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Sync runtime files
        run: |
          runtime_files=(
            server.js app.js index.html styles.css quotes.css bi.css crm.css
            danger.css sw.js manifest.webmanifest icon.svg storage.js
            package.json package-lock.json
          )
          rsync -az "${runtime_files[@]}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/proelium-operacional/"
          rsync -az assets/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/proelium-operacional/assets/"
          rsync -az database/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/proelium-operacional/database/"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'mkdir -p /opt/proelium-operacional/bot-testes/scripts'
          rsync -az bot-testes/scripts/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/proelium-operacional/bot-testes/scripts/"

      - name: Install, migrate and restart
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/proelium-operacional && npm ci --omit=dev --no-audit --no-fund && set -a && . /etc/proelium/database.env && set +a && npm run db:migrate && chown -R root:root /opt/proelium-operacional && systemctl restart proelium && systemctl is-active --quiet proelium && curl --fail --silent --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:4173/api/health | grep -q postgresql'

      - name: Run operational test bot
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/proelium-operacional && node bot-testes/scripts/smoke-bot.js http://127.0.0.1:4173'

      - name: Run isolated functional test bot
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/proelium-operacional && node bot-testes/scripts/functional-test-bot.js --report /tmp/proelium-functional-test-report.md'
