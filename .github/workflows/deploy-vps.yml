name: Deploy VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '.continue/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-vps.yml'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'PROJECT.md'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: proelium-vps-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and validate
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm --prefix frontend ci --no-audit --no-fund
          npm run check:frontend
          npm --prefix backend-nest ci --no-audit --no-fund
          npm run check:nest

      - name: Package Next.js standalone
        run: |
          rm -rf frontend/.next/standalone/frontend frontend/.next/standalone/.next/static frontend/.next/standalone/public
          mkdir -p frontend/.next/standalone/.next
          cp -R frontend/.next/static frontend/.next/standalone/.next/static
          if [ -d frontend/public ]; then cp -R frontend/public frontend/.next/standalone/public; fi

      - name: Upload Next.js artifact
        uses: actions/upload-artifact@v4
        with:
          name: proelium-next-standalone
          path: frontend/.next/standalone
          if-no-files-found: error
          include-hidden-files: true

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Require free space before recovery test
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -eu; available_kib=$(df --output=avail -k / | tail -n 1 | tr -d "[:space:]"); test -n "$available_kib"; if [ "$available_kib" -lt 1048576 ]; then echo "VPS has less than 1 GiB free; refusing deployment before backup/restore." >&2; exit 1; fi'

      - name: Create and verify recovery point before deployment
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -eu; cd /opt/proelium-operacional; systemctl is-active --quiet postgresql; bash database/backup.sh; bash database/verify-backup.sh'

      - name: Sync runtime files
        run: |
          runtime_files=(
            server.js app.js index.html styles.css quotes.css bi.css crm.css
            danger.css sw.js commercial-workflow.js technical-dimensioning.js technical-compatibility.js manifest.webmanifest icon.svg storage.js
            package.json package-lock.json auth-admin.js
          )
          rsync -az "${runtime_files[@]}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/proelium-operacional/"
          rsync -az assets/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/proelium-operacional/assets/"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'mkdir -p /opt/proelium-operacional/backend-nest/dist'
          rsync -az --delete backend-nest/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/proelium-operacional/backend-nest/dist/"
          rsync -az backend-nest/package.json backend-nest/package-lock.json \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/proelium-operacional/backend-nest/"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'mkdir -p /opt/proelium-operacional/frontend/.next/standalone'
          rsync -az --delete frontend/.next/standalone/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/proelium-operacional/frontend/.next/standalone/"
          rsync -az deploy/proelium-nest.service.example \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/proelium-nest.service"
          rsync -az deploy/proelium-next.service.example \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/proelium-next.service"
          rsync -az deploy/proelium-next-proxy.example.conf \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/proelium-next-locations.conf"
          rsync -az database/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/proelium-operacional/database/"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'mkdir -p /opt/proelium-operacional/bot-testes/scripts'
          rsync -az bot-testes/scripts/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/proelium-operacional/bot-testes/scripts/"

      - name: Confirm PostgreSQL is running
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -eu; systemctl is-active --quiet postgresql; pg_isready -h 127.0.0.1 -p 5432'

      - name: Install, migrate and restart
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
          'set -eu; cd /opt/proelium-operacional; npm ci --omit=dev --no-audit --no-fund; npm --prefix backend-nest ci --omit=dev --no-audit --no-fund; set -a; . /etc/proelium/database.env; set +a; npm run db:migrate; ls -l /tmp/proelium-next.service /tmp/proelium-nest.service /tmp/proelium-next-locations.conf; install -v -m 0644 /tmp/proelium-next.service /etc/systemd/system/proelium-next.service; install -v -m 0644 /tmp/proelium-nest.service /etc/systemd/system/proelium-nest.service; install -v -m 0644 /tmp/proelium-next-locations.conf /etc/nginx/snippets/proelium-next-locations.conf; nginx -t; systemctl reload nginx; systemctl daemon-reload; systemctl enable proelium-next proelium-nest; chown -R root:root /opt/proelium-operacional; systemctl restart proelium-next; systemctl is-active --quiet proelium-next; systemctl restart proelium; systemctl is-active --quiet proelium; systemctl restart proelium-nest; systemctl is-active --quiet proelium-nest; systemctl status proelium-nest --no-pager || true; journalctl -u proelium-nest -n 80 --no-pager || true; curl --fail --silent --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:4173/api/health | grep -q postgresql; curl --fail --silent --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:4174/api/health | grep -q proelium-backend-nest; curl --fail --silent --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:4300/processes >/dev/null'

      - name: Run operational test bot
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/proelium-operacional && node bot-testes/scripts/smoke-bot.js http://127.0.0.1:4173'

      - name: Run isolated functional test bot
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/proelium-operacional && node bot-testes/scripts/functional-test-bot.js --report /tmp/proelium-functional-test-report.md'
